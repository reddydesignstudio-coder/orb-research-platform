# Provider live check (TASK 007, PROVIDERS.md P-5). Manual only:
# Actions → Provider live check → Run workflow.
#
# Makes 5 paced calls to the deployed market-data function (5 of the Basic
# plan's 800 daily credits) and writes a report to the run summary.
# Stores nothing. The Twelve Data key is never used here — only the function has it.
#
# One-time manual step (owner): Supabase → Project Settings → API Keys →
# create a secret key (e.g. "github_live_check"), then in GitHub add the
# repository secret SUPABASE_SECRET_KEY with that value.
name: Provider live check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://mfsdctxhtinldnkffgbv.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Require the SUPABASE_SECRET_KEY secret
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not set. Add it under Settings → Secrets and variables → Actions (see README)."
            exit 1
          fi
      - name: Call market-data and report
        run: node scripts/live-check.mjs
