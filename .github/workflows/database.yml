# Applies new database migrations to the Supabase project (D-012).
#
# Order on every push to main that changes migrations:
#   1. unit tests incl. the destructive-migration guard  (npm test)
#   2. full schema tests on a throwaway PostgreSQL 17    (npm run test:db)
#   3. dry run against Supabase — prints what would be applied
#   4. apply
# Nothing reaches Supabase unless 1 and 2 pass.
#
# One-time manual step (owner): repository Settings → Secrets and variables →
# Actions → New repository secret: SUPABASE_DB_URL = the Session pooler
# connection string from Supabase (Connect → Session pooler), with the
# database password filled in.
name: Deploy database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tests/db/**'
      - 'tests/migrations.test.js'
      - 'scripts/test-db.sh'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway test container only.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npm run test:db

  deploy:
    name: Apply to Supabase
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the SUPABASE_DB_URL secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it under Settings → Secrets and variables → Actions (see README)."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check SUPABASE_DB_URL format (the password is never printed)
        run: node scripts/check-db-url.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Dry run (what will be applied)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --yes
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
