# Runs on every push and pull request. No npm install step: the project has
# no dependencies (docs/DECISIONS.md D-003).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Structure, secret scan and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --version
      - run: npm run check

  supabase:
    name: Supabase connectivity (public URL + publishable key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run check:supabase
